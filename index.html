<<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트폰 웹페이지</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .phone-frame {
            width: 375px;
            height: 812px;
            background: url('https://w.wallhaven.cc/full/4x/wallhaven-4x589m.jpg') no-repeat center center/cover;
            border-radius: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
            border: 8px solid #000;
        }

        .status-bar {
            height: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            padding-top: 10px;
        }

        .notch {
            width: 150px;
            height: 30px;
            background-color: #000;
            border-bottom-left-radius: 20px;
            border-bottom-right-radius: 20px;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
        }

        .widget-clock {
            color: white;
            padding: 20px 30px;
            margin-top: 20px;
        }

        .time {
            font-size: 64px;
            font-weight: 300;
            letter-spacing: -2px;
        }

        .date {
            font-size: 20px;
            font-weight: 400;
            opacity: 0.9;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            justify-items: center;
            margin-top: 20px;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 28px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .dock {
            width: 320px;
            height: 80px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 0 15px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* App Colors */
        .bg-messages { background: linear-gradient(135deg, #2nd, #2fd566); }
        .bg-calendar { background: white; color: #ff3b30; }
        .bg-photos { background: linear-gradient(135deg, #f0f, #0cf); }
        .bg-camera { background: #3a3a3c; }
        .bg-safari { background: #fff; color: #007aff; }
        .bg-music { background: linear-gradient(135deg, #ff234b, #ff5e3a); }
        .bg-notes { background: #ffcc00; color: #000; }
        .bg-maps { background: linear-gradient(135deg, #5ac8fa, #5856d6); }

    </style>
</head>
<body>

    <div class="phone-frame">
        <div class="notch"></div>
        <div class="status-bar">
            <span>11:59</span>
            <span>🔋</span>
        </div>

        <div class="widget-clock">
            <div class="time">11:59</div>
            <div class="date">10월 18일 일요일</div>
        </div>

        <div class="app-grid">
            <div class="app-icon bg-messages">💬</div>
            <div class="app-icon bg-calendar">📅</div>
            <div class="app-icon bg-photos">🖼️</div>
            <div class="app-icon bg-camera">📷</div>
            <div class="app-icon bg-safari">🌐</div>
            <div class="app-icon bg-music">🎵</div>
            <div class="app-icon bg-notes">📝</div>
            <div class="app-icon bg-maps">🗺️</div>
        </div>

        <div class="dock">
            <div class="app-icon bg-messages" style="width:55px; height:55px;">📞</div>
            <div class="app-icon bg-safari" style="width:55px; height:55px;">🧭</div>
            <div class="app-icon bg-photos" style="width:55px; height:55px;">📸</div>
            <div class="app-icon bg-music" style="width:55px; height:55px;">🎧</div>
        </div>
    </div>

</body>
</html>
