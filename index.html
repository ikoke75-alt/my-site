<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김독자의 폰</title>
    <style>
        :root {
            --bg-color: #121212;
            --phone-width: 375px;
            --phone-height: 812px;
            --status-bar-height: 40px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* 스마트폰 프레임 */
        .phone-frame {
            width: var(--phone-width);
            height: var(--phone-height);
            background: #000;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            border: 8px solid #1a1a1a;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        /* 펀치홀 */
        .punch-hole {
            width: 110px;
            height: 30px;
            background-color: #000;
            border-radius: 20px;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-lens {
            width: 10px;
            height: 10px;
            background-color: #1c1c1c;
            border-radius: 50%;
            border: 2px solid #2a2a2a;
        }

        /* 상태 표시줄 */
        .status-bar {
            height: var(--status-bar-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px 0 25px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            z-index: 25;
            position: relative;
        }

        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
            height: 100%;
            box-sizing: border-box;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .app-icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .app-name {
            font-size: 12px;
            color: #fff;
        }

        .app-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #fff;
            border-radius: 40px;
            z-index: 20;
            flex-direction: column;
            box-sizing: border-box;
            padding-top: var(--status-bar-height);
        }

        .screen-header {
            padding: 15px 20px 10px 20px;
            background-color: #000;
            border-bottom: 1px solid #222;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .edit-btn {
            color: #0a84ff;
            font-size: 16px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .tab-group {
            display: flex;
            background-color: #1c1c1e;
            border-radius: 9px;
            padding: 2px;
            width: 160px;
            margin: 0 auto;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            font-size: 13px;
            font-weight: 500;
            border-radius: 7px;
            cursor: pointer;
        }

        .tab.active {
            background-color: #636366;
            color: #fff;
        }

        .screen-title {
            font-size: 32px;
            font-weight: 700;
            margin-top: 10px;
        }

        .call-list {
            flex: 1;
            overflow-y: auto;
            background-color: #000;
        }

        .call-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #1c1c1e;
        }

        .call-icon {
            font-size: 16px;
            margin-right: 12px;
            color: #ff453a;
        }

        .call-info {
            flex: 1;
        }

        .caller-name {
            font-size: 17px;
            font-weight: 600;
            color: #ff453a;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .missed-count {
            font-size: 15px;
            font-weight: 700;
            color: #ff453a;
        }

        .call-type {
            font-size: 13px;
            color: #8e8e93;
        }

        .call-time {
            font-size: 14px;
            color: #8e8e93;
            margin-right: 10px;
        }

        .info-btn {
            color: #0a84ff;
            font-size: 18px;
            border: 1px solid #0a84ff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: none;
            cursor: pointer;
        }

        .bottom-nav {
            height: 60px;
            background-color: #1c1c1e;
            border-top: 1px solid #2c2c2e;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 15px;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8e8e93;
            font-size: 10px;
            text-decoration: none;
        }

        .nav-item.active {
            color: #0a84ff;
        }

        .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">

            <div class="bottom-nav">

                </a>
            </div>
        </div>
    </div>

    <script>
        function openApp(screenId) {
            document.getElementById('home-screen').style.display = 'none';
            document.getElementById(screenId).style.display = 'flex';
        }

        function closeApp() {
            const screens = document.querySelectorAll('.app-screen');
            screens.forEach(screen => screen.style.display = 'none');
            document.getElementById('home-screen').style.display = 'flex';
        }
    </script>
</body>
</html>
