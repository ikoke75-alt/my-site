<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김독자의 폰</title>
    <style>
        :root {
            --bg-color: #121212;
            --phone-width: 375px;
            --phone-height: 812px;
            --status-bar-height: 40px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #fff;
            overflow: hidden;
        }

        /* 스마트폰 프레임 */
        .phone-frame {
            width: var(--phone-width);
            height: var(--phone-height);
            background: #000;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            border: 8px solid #1a1a1a;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
        }

        /* 펀치홀 */
        .punch-hole {
            width: 110px;
            height: 30px;
            background-color: #000;
            border-radius: 20px;
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 30;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .camera-lens {
            width: 10px;
            height: 10px;
            background-color: #1c1c1c;
            border-radius: 50%;
            border: 2px solid #2a2a2a;
        }

        /* 상태 표시줄 */
        .status-bar {
            height: var(--status-bar-height);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 25px 0 25px;
            font-size: 14px;
            font-weight: 600;
            color: #fff;
            z-index: 25;
            flex-shrink: 0;
        }

        /* 홈 화면 */
        #home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 60px;
            flex: 1;
            background-color: #000;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .app-icon-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
        }

        .app-icon {
            width: 60px;
            height: 60px;
            border-radius: 15px;
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 28px;
            margin-bottom: 6px;
        }

        .app-name {
            font-size: 12px;
            color: #fff;
        }

        /* 전화 앱 전체 화면 */
        .app-screen {
            display: none;
            position: absolute;
            top: var(--status-bar-height);
            left: 0;
            width: 100%;
            height: calc(100% - var(--status-bar-height));
            background-color: #000;
            color: #fff;
            z-index: 20;
            flex-direction: column;
            box-sizing: border-box;
        }

        .screen-header {
            padding: 15px 20px 10px 20px;
            background-color: #000;
            border-bottom: 1px solid #222;
            flex-shrink: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .edit-btn {
            color: #0a84ff;
            font-size: 16px;
            background: none;
            border: none;
            cursor: pointer;
        }

        .tab-group {
            display: flex;
            background-color: #1c1c1e;
            border-radius: 9px;
            padding: 2px;
            width: 160px;
            margin: 0 auto;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 6px 0;
            font-size: 13px;
            font-weight: 500;
            border-radius: 7px;
            cursor: pointer;
            color: #8e8e93;
        }

        .tab.active {
            background-color: #636366;
            color: #fff;
        }

        .screen-title {
            font-size: 32px;
            font-weight: 700;
            margin-top: 10px;
        }

        /* 앱 내부 탭 콘텐츠 영역 */
        .tab-content {
            display: none;
            flex: 1;
            overflow-y: auto;
            flex-direction: column;
        }

        .tab-content.active {
            display: flex;
        }

        .call-list {
            flex: 1;
            overflow-y: auto;
            background-color: #000;
        }

        .call-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid #1c1c1e;
        }

        .call-icon {
            font-size: 16px;
            margin-right: 12px;
            color: #ff453a;
        }

        .call-info {
            flex: 1;
        }

        .caller-name {
            font-size: 17px;
            font-weight: 600;
            color: #ff453a;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .missed-count {
            font-size: 15px;
            font-weight: 700;
            color: #ff453a;
        }

        .call-type {
            font-size: 13px;
            color: #8e8e93;
        }

        .call-time {
            font-size: 14px;
            color: #8e8e93;
            margin-right: 10px;
        }

        .info-btn {
            color: #0a84ff;
            font-size: 18px;
            border: 1px solid #0a84ff;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: none;
            cursor: pointer;
        }

        /* 키패드 화면 디자인 스타일 */
        .keypad-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .keypad-display {
            font-size: 32px;
            margin-bottom: 30px;
            color: #fff;
            letter-spacing: 2px;
            height: 40px;
        }

        .keypad-grid {
            display: grid;
            grid-template-columns: repeat(3, 75px);
            gap: 15px;
            justify-content: center;
        }

        .key-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background-color: #2c2c2e;
            color: #fff;
            font-size: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .key-btn:active {
            background-color: #48484a;
        }

        /* 하단 내비게이션 바 */
        .bottom-nav {
            height: 60px;
            background-color: #1c1c1e;
            border-top: 1px solid #2c2c2e;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 15px;
            flex-shrink: 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8e8e93;
            font-size: 10px;
            text-decoration: none;
            cursor: pointer;
            background: none;
            border: none;
        }

        .nav-item.active {
            color: #0a84ff;
        }

        .nav-icon {
            font-size: 22px;
            margin-bottom: 2px;
        }
    </style>
</head>

                </div>

        </div>
